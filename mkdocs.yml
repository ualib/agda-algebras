# =============================================================================
# agda-algebras — MkDocs (Material) site configuration
# -----------------------------------------------------------------------------
# The rendering pipeline for agda-algebras.universalalgebra.org (ADR-007).  The
# site is built from the `.lagda.md` sources by
# scripts/python/mkdocs_gen_library.py (mkdocs-gen-files + literate-nav), which
# mounts every module as a page and generates the navigation.  The published
# build, `make site-full`, first runs `agda --html` twice: `make agda-md` gives
# the highlighted, hyperlinked code blocks the pages embed, and `make html` the
# classic site published at /classic/.  `make site` skips both, so its code
# blocks are plain, for quick work on prose and the theme.  Inline Agda terms
# are kramdown attribute spans (`Algebra`{.AgdaRecord}) colored by
# docs/stylesheets/agda.css; the theme is described in the -- Theme -- section
# below and in docs/site-guide.md.
#
#   Build : nix develop --command make site-full  ->  ./site  (what CI publishes)
#   Fast  : nix develop --command make site       ->  ./site  (plain code blocks)
#   Serve : nix develop --command make serve      (http://127.0.0.1:8000)
# =============================================================================

site_name: The Agda Universal Algebra Library
site_url: https://agda-algebras.universalalgebra.org/
site_description: >-
  A formalization of universal algebra in dependent type theory — signatures,
  algebras, homomorphisms, terms, subalgebras, varieties, and a
  machine-checked proof of Birkhoff's HSP theorem — written in literate Agda.
site_author: The agda-algebras development team
# HTML is allowed here, and the footer is where the sibling library is linked
# from every page (#621).  The agda-lattices URL is its repository until its
# site is live; the same URL is in extra.agda_lattices below (the navigation
# entry) and in docs/_links.md (the landing page's card), and the three move
# together.
copyright: >-
  Copyright &copy; 2018&ndash;2026 the agda-algebras development team.
  Documentation under CC BY-SA 4.0.
  &middot; Sibling library:
  <a href="https://github.com/ualib/agda-lattices">agda-lattices</a>

repo_url: https://github.com/ualib/agda-algebras
repo_name: ualib/agda-algebras
# Sources live in src/ (not docs/); gen-files sets the per-page edit path to
# the real `.lagda.md`, so this prefix + that path forms the GitHub edit URL.
edit_uri: edit/master/

docs_dir: docs

# Build hook: rewrite repo-relative prose links (src/…, docs/adr/…, root meta
# files) into site URLs.  Never touches fenced Agda code.
hooks:
  - scripts/python/mkdocs_hooks.py

# `mkdocs serve` watches docs/ and mkdocs.yml by default; the library is mounted
# from src/ by gen-files, so add it (and the generators) for live reload while
# authoring modules or iterating on the pipeline.
watch:
  - src
  - scripts/python/mkdocs_gen_library.py
  - scripts/python/mkdocs_hooks.py

# -- Theme --------------------------------------------------------------------
# Constellation, the design of williamdemeo.org, ported back to the site it was
# derived from (#621; ADR-007, Decision 8).  The theme lives in its own files,
# which a sibling site (agda-lattices) copies unchanged:
#
#   docs/assets/fonts/         the self-hosted faces, their OFL licenses, and
#                              fonts.css (generated by `make fonts`)
#   docs/stylesheets/tokens.css   colors, type, spacing: every value
#   docs/stylesheets/theme.css    Material's variables and chrome, in tokens
#   docs/stylesheets/agda.css     Agda's token classes, in tokens
#   overrides/                 the 404 page and the repository chip
#
# docs/stylesheets/site.css is this site's own components, on the same tokens.
theme:
  name: material
  # 404.html (the page as an unfillable Agda goal) and partials/source.html
  # (the repository chip without Material's api.github.com fetch); each file
  # carries its reasoning.
  custom_dir: overrides
  language: en
  logo: assets/lambda.png           # the UALib ribbon-λ (home icon, top-left)
  favicon: assets/lambda.png
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    view: material/file-eye-outline
  features:
    # Instant navigation swaps the page body over XHR instead of reloading,
    # so the palette, the "Show all Agda" and "Tooltips" switches, and the
    # search index survive a click.  The site's scripts subscribe to
    # Material's `document$`, which emits on every such navigation, so they
    # re-run on each new page.  A link to a URL the sitemap does not list
    # (/classic/, another site) is an ordinary page load.
    - navigation.instant
    # Tabs stay, though williamdemeo.org has none (#621).  This site's module
    # tree is deep (Setoid > Varieties > Maltsev > Distributivity), and the
    # tabs keep the sidebar one level shallower, where long module names
    # already truncate; and the landing page hides the sidebar for its
    # full-width hero, so on a desktop the tabs are its only navigation.
    # Below 76.25em (1220 px) Material folds both into the drawer, so phones
    # and tablets see no difference.
    - navigation.tabs               # top-level sections as tabs
    - navigation.tabs.sticky
    - navigation.top                # back-to-top button
    - navigation.indexes            # clickable section-overview pages
    - navigation.tracking           # update the URL with the active anchor
    - navigation.footer             # previous / next links
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
    - content.tooltips
  # No Google Fonts.  `false` is what removes the <link rel=preconnect> to
  # fonts.gstatic.com and the stylesheet from fonts.googleapis.com that
  # Material emits otherwise (#531); docs/assets/fonts/fonts.css declares the
  # self-hosted faces instead, and tokens.css names them.  Load-bearing:
  # `make offline-check` fails the build on a Google Fonts link.
  font: false
  # Dark first, and no `media:` on either entry.  Material selects the first
  # palette when nothing is stored, and a `media` key would hand that
  # decision to the operating system.  A visitor with a system-wide light
  # preference gets a dark page until they click the toggle once, after which
  # the choice is remembered in local storage.  `custom` on primary and
  # accent means "no built-in Material color": the values come from
  # tokens.css.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

# Order matters: the faces are declared before the tokens that name them, the
# tokens before the rules that use them, and the site's own rules last.
extra_css:
  - assets/fonts/fonts.css
  - stylesheets/tokens.css
  - stylesheets/theme.css
  - stylesheets/agda.css
  - stylesheets/site.css

extra_javascript:
  # Adds a copy button to highlighted `<pre class="Agda">` blocks, which
  # Material's content.code.copy feature does not reach (see the script).
  - assets/js/agda-copy.js
  # Header "Show more Agda" control: reveals the import/scaffolding blocks
  # that gen-files re-surfaces as `hidden-source` (#431, M10-5).
  - assets/js/agda-toggle.js
  # Type-on-hover tooltips: a popover with a token's definition snippet, plus a
  # header on/off toggle (#429, M10-3).  Pairs each linked token with the
  # `<a id="offset">` at its definition in the agda --html output.
  - assets/js/agda-hover.js
  # Auto-advancing carousel for the landing's Featured-results cards.
  - assets/js/carousel.js
  # The module constellation; on every page so that instant navigation runs
  # it, and it fetches d3 only on the page that draws (see the script).
  - assets/js/constellation.js

# -- Plugins ------------------------------------------------------------------
# Order matters: gen-files must populate the virtual library tree + SUMMARY.md
# before literate-nav reads it and before section-index promotes barrels.
plugins:
  # The separator decides what a word is, at index time and at query time
  # alike.  Material's default, `[\s\-]+`, treats `Setoid.Varieties.HSP` as
  # one word, so a search for `HSP` or `Varieties` misses the module's own
  # name.  This one, williamdemeo.org's, splits on the dot (but not inside a
  # number like `4.4`) and on the punctuation around an identifier; it is the
  # separator Material's documentation uses, less the clause that splits a
  # camel-cased word (which would cut `IsEquivalence` in two).
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'
  - gen-files:
      scripts:
        - scripts/python/mkdocs_gen_library.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - macros:
      # Non-default Jinja2 delimiters: Agda's `{{ }}` / `{ }` / `{% %}` / `{# #}`
      # appear throughout the corpus, so the standard delimiters would corrupt
      # code blocks.  These triples occur nowhere in src/ (verified).  Link
      # includes are handled by pymdownx.snippets (below), not by macros.
      j2_variable_start_string: "[[["
      j2_variable_end_string: "]]]"
      j2_block_start_string: "[[%"
      j2_block_end_string: "%]]"
      j2_comment_start_string: "[[#"
      j2_comment_end_string: "#]]"
      on_error_fail: false
  - redirects:
      # Legacy flat `Module.Submodule.html` URLs → new directory URLs are added
      # at the cutover (see #430 checklist).  These resolve on the parked archive
      # at ualib.org; the map here is for the new host.  Empty for now so the
      # plugin is wired and ready without inventing redirects prematurely.
      redirect_maps: {}

# -- Markdown extensions ------------------------------------------------------
markdown_extensions:
  - attr_list                       # THE load-bearing one: `x`{.AgdaFunction}
  - md_in_html
  - def_list
  - tables
  - footnotes
  - admonition
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
  - pymdownx.highlight:
      guess_lang: false             # ```agda blocks render as plain monospace
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true         # the roadmap's [ ] / [x] checklists
  - pymdownx.emoji:                 # Material / Octicons icons (no corpus :word: collisions)
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [".", "docs"]
      auto_append: ["_links.md"]    # shared reference-link library, every page
      check_paths: true

# -- Files in docs/ that are not site pages -----------------------------------
exclude_docs: |
  audits/
  notes/
  papers/
  _links.md

# -- Link validation ----------------------------------------------------------
# Internal cross-references use ROOT-RELATIVE targets (/Module/Submodule/) from
# docs/_links.md; these are intentional and resolve at the site root, so do not
# warn about them.  Genuinely missing relative links remain warnings.
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore
  nav:
    omitted_files: ignore

# -- Site variables (available to macros as [[[ … ]]]) ------------------------
extra:
  # The sibling library, linked from the navigation (mkdocs_gen_library.py
  # reads this), the footer (`copyright` above) and the landing page
  # (docs/_links.md).  Its repository until its site is live.
  agda_lattices: https://github.com/ualib/agda-lattices
  agda_version: "2.9.0"
  stdlib_version: "2.3"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ualib/agda-algebras
      name: agda-algebras on GitHub
